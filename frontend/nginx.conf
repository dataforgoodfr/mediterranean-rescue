# Le site en production : nginx sert les fichiers construits. /api ne passe pas par ici, Traefik
# l'envoie directement au backend (docker-compose.prod.yaml).
server {
    listen 80;
    root /usr/share/nginx/html;

    # Une adresse inconnue renvoie la page de l'app : c'est React Router qui affiche la bonne page.
    # index.html n'est jamais gardé en cache : après un redéploiement, il pointe sur les
    # nouveaux fichiers.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Les fichiers construits portent leur empreinte dans leur nom : cache d'un an. Un fichier
    # inconnu renvoie 404, et non la page HTML, que le navigateur refuserait comme script.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
