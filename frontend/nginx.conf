# Le site en production : nginx sert les fichiers construits. /api ne passe pas par ici, Traefik
# l'envoie directement au backend (docker-compose.prod.yaml).
server {
    listen 80;
    root /usr/share/nginx/html;

    # Une adresse inconnue renvoie la page de l'app : c'est React Router qui affiche la bonne page.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
