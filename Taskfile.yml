# Les commandes du projet, à lancer depuis la racine. `task --list` les décrit.
# La CI lance les mêmes tâches (.github/workflows/ci.yml). Doc : https://taskfile.dev
version: "3"

env:
  DEV: "true"

tasks:
  setup:
    desc: Installe les outils (mise), les dépendances et les contrôles avant commit
    cmds:
      - mise install
      - cd backend && uv sync
      - cd frontend && pnpm install
      - cd backend && uv run pre-commit install

  dev:
    desc: Lance tout le projet avec Docker (site, API, base)
    cmds:
      - docker compose -f docker-compose.dev.yaml up

  check:
    desc: Toutes les vérifications avant de pousser (pre-commit, backend, frontend)
    cmds:
      - task: check:pre-commit
      - task: check:backend
      - task: check:frontend

  check:pre-commit:
    desc: Les contrôles de pre-commit sur tout le dépôt
    cmds:
      - uv run --project backend pre-commit run --all-files --show-diff-on-failure

  check:backend:
    desc: "Le backend : dépendances à jour, types (mypy) et tests"
    dir: backend
    cmds:
      - uv sync --locked
      - uv run mypy
      - uv run pytest

  check:frontend:
    desc: "Le frontend : lint, types de l'API à jour, tests et construction"
    dir: frontend
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm lint
      - pnpm format:check
      - pnpm api:check
      - pnpm test
      - pnpm build

  test:
    desc: Les tests du backend et du frontend
    cmds:
      - task: test:backend
      - task: test:frontend

  test:backend:
    desc: Les tests du backend
    dir: backend
    cmds:
      - uv run pytest

  test:frontend:
    desc: Les tests du frontend
    dir: frontend
    cmds:
      - pnpm test

  api:
    desc: Régénère le schéma de l'API (backend/openapi.json) puis ses types (frontend/src/api/schema.ts)
    cmds:
      - cd backend && uv run python -m app.openapi_schema
      - cd frontend && pnpm api:types

  db:migrate:
    desc: Met la base de DATABASE_URL à jour avec les migrations (l'API le fait aussi au démarrage)
    dir: backend
    cmds:
      - uv run python -m app.migrate

  db:revision:
    desc: 'Écrit une migration depuis les modèles, avec le numéro suivant : task db:revision -- "add the state of an operation"'
    dir: backend
    preconditions:
      - sh: test -n "{{.CLI_ARGS}}"
        msg: 'Donne le sujet de la migration : task db:revision -- "add the state of an operation"'
    cmds:
      # Le numéro suit le dernier fichier de migrations/versions/ (0001 donne 0002).
      - |
        last=$(ls migrations/versions | grep -E '^[0-9]{4}_' | sort | tail -n 1 | cut -c 1-4)
        next=$(printf '%04d' $((10#${last:-0} + 1)))
        uv run alembic revision --autogenerate --rev-id "$next" -m {{.CLI_ARGS}}

  data:fictive:
    desc: "Charge le jeu fictif dans la base, une seule fois : relancée, la tâche l'ajoute une deuxième fois"
    dir: backend
    cmds:
      - uv run python -m scripts.load_fictive_data fixtures/3_fictive_data.csv
