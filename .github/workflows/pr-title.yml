# Le titre de la pull request suit les commits conventionnels (`feat: …`, `fix: …`) : au merge en
# squash, il devient le message du commit sur main.
# Action : https://github.com/amannn/action-semantic-pull-request
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
